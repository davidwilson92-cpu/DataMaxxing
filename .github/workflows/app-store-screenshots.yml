name: Campaign simulator visual review
on:
  push:
    branches: ['codex/ios-beta-campaign-preview-9460118']
permissions:
  actions: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read campaign screenshots from the simulator run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in $(seq 1 90); do
            if gh run download 46150367125 --name campaign-compact-screenshots --dir evidence; then break; fi
            sleep 10
          done
          python3 - <<'PY'
          import base64, io, json, pathlib
          from PIL import Image
          root = pathlib.Path("evidence")
          manifest = json.loads(next(root.rglob("manifest.json")).read_text())
          def walk(x):
              if isinstance(x, dict):
                  if "exportedFileName" in x:
                      yield x
                  for v in x.values():
                      yield from walk(v)
              if isinstance(x, list):
                  for v in x:
                      yield from walk(v)
          for a in walk(manifest):
              name = a.get("suggestedHumanReadableName", "")
              if "Campaign landing -" not in name:
                  continue
              with Image.open(next(root.rglob(a["exportedFileName"]))) as im:
                  im.thumbnail((410, 820))
                  out = io.BytesIO()
                  im.convert("RGB").save(out, "JPEG", quality=80)
                  data = base64.b64encode(out.getvalue()).decode()
                  print("PREVIEW_NAME " + name)
                  for pos in range(0, len(data), 1800):
                      print("PREVIEW_DATA " + data[pos:pos+1800])
                  print("PREVIEW_END")
          PY
