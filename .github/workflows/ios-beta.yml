name: iOS beta validation
on:
  workflow_dispatch:
  push:
    branches: ['codex/ios-beta-*']
    paths: ['ios/**', '.github/workflows/ios-beta.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-beta.yml']
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify toolchain and create project
        run: |
          xcodebuild -version
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Build and test on iPhone simulator
        run: |
          cd ios
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone") and x.get("isAvailable")))')
          xcodebuild test -project Zova.xcodeproj -scheme Zova -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath ../ios-results.xcresult CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGNING_ALLOWED=YES
      - name: Compile release for iPhone
        run: |
          cd ios
          xcodebuild build -project Zova.xcodeproj -scheme Zova -configuration Release -destination 'generic/platform=iOS' -derivedDataPath ../ios-build CODE_SIGNING_ALLOWED=NO
      - name: Preserve simulator review evidence
        if: always()
        run: |
          if [ -d ios-results.xcresult ]; then
            xcrun xcresulttool export attachments --path ios-results.xcresult --output-path ios-test-attachments
          fi
      - name: Upload simulator review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-simulator-evidence
          path: |
            ios-results.xcresult
            ios-test-attachments
