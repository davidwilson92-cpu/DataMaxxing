workflows:
  zova-internal-pilot:
    name: Zova internal TestFlight pilot assignment
    max_build_duration: 10
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: zova-testflight
    scripts:
      - name: Assign the reviewed build to the existing internal group
        script: |
          set -eu
          test "$CM_BRANCH" = "codex/testflight-pilot-20261101"
          python3 scripts/check_beta_release.py
          python3 - <<'PY'
          import json, subprocess
          number = '21'
          group = 'Zova Social Internal Beta'
          app = '6824416979'
          result = subprocess.check_output(['app-store-connect','builds','list','--json','--app-id',app,'--platform','IOS','--pre-release-version','1.0.0','--build-version-number',number,'--not-expired','--processing-state','VALID'], text=True)
          rows = json.loads(result)
          if not isinstance(rows, list) or len(rows)!=1:
              raise SystemExit('Expected one processed, unexpired Zova 1.0.0 build ' + number)
          build = rows[0]
          if build['attributes']['version'] != number or build['attributes']['processingState'] != 'VALID':
              raise SystemExit('Unexpected build returned')
          print('Verified processed Zova build', number, flush=True)
          subprocess.run(['app-store-connect','beta-groups','add-build',build['id'],'--beta-group',group], check=True)
          subprocess.run(['app-store-connect','builds','add-beta-test-info',build['id'],'--whats-new','Start a campaign brief, leave Studio and reopen Campaign to restore it. Move a post containing tonight to another day and check the caption warning. Review the angles of follow-up posts.'],check=True)
          subprocess.run(['app-store-connect','beta-groups','add-build',build['id'],'--beta-group','Zova Social External Beta'],check=True)
          details = json.loads(subprocess.check_output(['app-store-connect','builds','beta-details',build['id'],'--json'],text=True))
          if isinstance(details,list): details, = details
          state = details['attributes']['internalBuildState']
          print('Internal testing state:',state,flush=True)
          if state != 'IN_BETA_TESTING': raise SystemExit('Internal testing state needs review')
          external = details['attributes']['externalBuildState']
          print('External testing state:',external,flush=True)
          if external == 'READY_FOR_BETA_SUBMISSION':
              subprocess.run(['app-store-connect','builds','submit-to-testflight',build['id']],check=True)
          details = json.loads(subprocess.check_output(['app-store-connect','builds','beta-details',build['id'],'--json'],text=True))
          if isinstance(details,list): details, = details
          print('Final external status:',details['attributes']['externalBuildState'], 'auto notification:',details['attributes'].get('autoNotifyEnabled'),flush=True)
          PY
