workflows:
  zova-ios-internal-beta:
    name: Zova Social — internal TestFlight beta
    max_build_duration: 40
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: zova-testflight
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.zovasocial.app
      vars:
        APP_STORE_APPLE_ID: "6824416979"
        ZOVA_SERVER_URL: "https://zova-social.com"
      xcode: "26.6"
    scripts:
      - name: Verify isolated beta scope
        script: |
          set -eu
          test "$CM_BRANCH" = "codex/ios-beta-20261019"
          python3 scripts/check_beta_release.py
      - name: Generate reviewed iPhone project
        script: |
          set -eu
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Configure existing signing identities
        script: xcode-project use-profiles --project ios/Zova.xcodeproj --custom-export-options='{"testFlightInternalTestingOnly":true}'
      - name: Archive the iPhone beta
        script: |
          set -eu
          xcode-project build-ipa --project ios/Zova.xcodeproj --scheme Zova --archive-xcargs "CURRENT_PROJECT_VERSION=$((BUILD_NUMBER + 1)) ZOVA_SERVER_URL=$ZOVA_SERVER_URL"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
