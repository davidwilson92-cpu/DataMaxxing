{% if brand %}<form action="/brands/switch" method="post" class="brand-switch"><label for="brandWorkspace">Brand workspace</label><select id="brandWorkspace" name="brand_id">{% for item in brand.choices %}<option value="{{ item.id }}" {% if item.id==brand.id %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select><button class="button ghost">Open workspace</button></form>{% endif %}
