{% extends "base.html" %}{% block title %}Writing style — Zova{% endblock %}
{% block body %}<main class="onboarding-wrap">{% include "progress.html" %}<section class="onboarding-card wide"><div class="eyebrow">TEACH ZOVA HOW YOU WRITE</div><h1>Make every draft sound like you.</h1><p>Give Zova a little context and every draft will feel more natural.</p><form method="post" action="/account/preferences"><input type="hidden" name="next" value="/onboarding/complete"><label>Writing tone</label><textarea name="writing_tone" rows="2">{{prefs.writing_tone}}</textarea><label>Audience</label><textarea name="audience" rows="2">{{prefs.audience}}</textarea><label>Topics</label><textarea name="topics" rows="2">{{prefs.topics}}</textarea><label>Things to avoid</label><textarea name="things_to_avoid" rows="2">{{prefs.things_to_avoid}}</textarea><label>Example posts</label><textarea name="example_posts" rows="4">{{prefs.example_posts}}</textarea><div class="two"><div><label>Preferred post length</label><input type="number" name="preferred_post_length" value="{{prefs.preferred_post_length}}" min="30" max="4000"></div><div><label>Timezone</label><input name="timezone" value="{{prefs.timezone}}"></div></div><div class="onboarding-actions"><a class="button ghost" href="/onboarding/complete">Skip for now</a><button class="button primary" type="submit">Save and open Studio</button></div></form></section></main>{% endblock %}
