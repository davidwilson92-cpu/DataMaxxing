openapi: 3.1.0
info:
  title: Zova X Posting API
  version: 5.1.0
  description: Backward-compatible X preview and publish actions for an authenticated creator account.
servers:
  - url: https://REPLACE-WITH-YOUR-SERVICE.onrender.com
paths:
  /x/preview:
    post:
      operationId: previewPost
      summary: Preview the exact X post without publishing it
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: {type: string, minLength: 1, maxLength: 280}
              required: [text]
      responses:
        "200": {description: Preview successful}
  /x/post:
    post:
      operationId: publishPost
      summary: Publish an explicitly approved post to X
      x-openai-isConsequential: true
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: {type: string, minLength: 1, maxLength: 280}
                approved: {type: boolean, enum: [true]}
              required: [text, approved]
      responses:
        "200": {description: Published successfully}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
