services:
  - type: web
    name: x-chatgpt-poster
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: x-chatgpt-poster-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://x-chatgpt-poster.onrender.com
      - key: X_OAUTH2_CLIENT_ID
        sync: false
      - key: X_OAUTH2_CLIENT_SECRET
        sync: false
      - key: X_OAUTH2_REDIRECT_URI
        value: https://x-chatgpt-poster.onrender.com/callback/x
      - key: BOOTSTRAP_CREATOR_API_KEY
        sync: false
      - key: BOOTSTRAP_CREATOR_NAME
        value: DataMaxxing
      - key: X_USERNAME
        value: DataMaxxing
      - key: X_API_KEY
        sync: false
      - key: X_API_SECRET
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_TOKEN_SECRET
        sync: false

databases:
  - name: x-chatgpt-poster-db
    plan: free
    databaseName: x_poster
