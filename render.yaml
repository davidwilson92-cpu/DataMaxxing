services:
  - type: web
    name: x-chatgpt-poster
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: x-chatgpt-poster-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ADMIN_EMAILS
        value: zova.social@gmail.com
      - key: SESSION_SECRET
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://x-chatgpt-poster.onrender.com
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: APPLE_REDIRECT_URI
        value: https://x-chatgpt-poster.onrender.com/auth/apple/callback
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: X_OAUTH2_CLIENT_ID
        sync: false
      - key: X_OAUTH2_CLIENT_SECRET
        sync: false
      - key: X_OAUTH2_REDIRECT_URI
        value: https://x-chatgpt-poster.onrender.com/callback/x
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_GRAPH_VERSION
        value: v23.0
      - key: META_REDIRECT_URI
        value: https://x-chatgpt-poster.onrender.com/oauth/meta/callback
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_REDIRECT_URI
        value: https://x-chatgpt-poster.onrender.com/oauth/tiktok/callback
      - key: TIKTOK_DEFAULT_PRIVACY
        value: PUBLIC_TO_EVERYONE
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: REQUIRE_SUBSCRIPTION
        value: "false"
      - key: ZOVA_PRICE_LABEL
        value: Creator plan
      - key: ZOVA_PRICE_NOTE
        value: Cancel from your account at any time.
      - key: SCHEDULER_SECRET
        generateValue: true
      - key: SCHEDULER_INTERVAL_SECONDS
        value: "60"
      - key: S3_BUCKET
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      # Legacy X Custom GPT compatibility. Existing values can remain in Render.
      - key: BOOTSTRAP_CREATOR_API_KEY
        sync: false
      - key: BOOTSTRAP_CREATOR_NAME
        sync: false
      - key: X_USERNAME
        sync: false
      - key: X_API_KEY
        sync: false
      - key: X_API_SECRET
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_TOKEN_SECRET
        sync: false

databases:
  - name: x-chatgpt-poster-db
    plan: free
    databaseName: x_poster
